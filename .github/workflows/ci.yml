name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-integration:
    name: Build e integração Docker
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Gerar build do frontend
        working-directory: frontend
        run: npm run build

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm ci

      - name: Preparar variáveis de ambiente para teste
        run: |
          cat > backend/.env <<'EOF'
          PORT=3000
          MONGODB_URI=mongodb://mongo:27017/trabalho_final
          JWT_SECRET=ci_test_secret_key_with_at_least_32_characters
          EOF

      - name: Validar configuração do Docker Compose
        run: docker compose config --quiet

      - name: Construir e iniciar os serviços
        run: docker compose up -d --build --wait

      - name: Verificar API e frontend
        run: |
          curl --fail --retry 10 --retry-delay 3 http://localhost:3000/api
          curl --fail --retry 10 --retry-delay 3 http://localhost:5173/

      - name: Executar testes automatizados de integração da API
        run: docker compose exec -T backend npm test

      - name: Exibir logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Encerrar ambiente de teste
        if: always()
        run: docker compose down
